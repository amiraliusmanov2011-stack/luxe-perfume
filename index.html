<option value="desc">Сначала дороже</option>
</select>
</div>

<h2 class="section-title">НАША КОЛЛЕКЦИЯ</h2>
<div class="products" id="products"></div>

<div style="text-align:center;margin-top:35px">
<button class="gold" id="adminToggle">⚙ Управление товарами</button>
</div>

<section class="admin" id="admin">
<h2>Добавить новый аромат</h2>
<form id="productForm">
<input id="pname" placeholder="Название аромата" required>
<input id="pprice" type="number" min="0" placeholder="Цена в рублях" required>
<input id="pvolume" placeholder="Объём, например 100 мл">
<input id="pcategory" placeholder="Категория">
<input id="pimage" placeholder="Ссылка на фотографию">
<textarea id="pdesc" placeholder="Описание аромата"></textarea>
<button class="gold" type="submit">Добавить товар</button>
</form>
<div class="admin-actions">
<button class="gold" id="exportBtn">Скачать каталог</button>
<button class="gold" id="importBtn">Загрузить каталог</button>
<input type="file" id="importFile" accept=".json" hidden>
</div>
</section>
</main>

<button class="cart-button" id="cartOpen">
🛒 Корзина <span class="cart-count" id="cartCount">0</span>
</button>

<div class="cart-panel" id="cartPanel">
<div class="cart-content">
<button class="close-cart" id="cartClose">✕ Закрыть</button>
<h2>Моя корзина 🛒</h2>
<div id="cartItems"></div>
<div class="cart-total">Итого: <span id="cartTotal">0 ₽</span></div>
<button class="cart-checkout" id="cartCheckout">ОФОРМИТЬ ЗАКАЗ В WHATSAPP</button>
</div>
</div>

<footer>
<div class="logo" style="font-size:22px">LUXE PERFUME</div>
<p>Твой аромат — твой стиль.</p>
</footer>

<script>join('\n')+
'\n\nИтого: '+money(
cart.reduce((s,x)=>s+x.pricex.qty,0)
);

window.open(
'https://wa.me/'+PHONE+'?text='+encodeURIComponent(message),
'_blank'
);
};

$('adminToggle').onclick=()=>{
$('admin').classList.toggle('show');
$('admin').scrollIntoView({behavior:'smooth',block:'nearest'});
};

$('productForm').addEventListener('submit',e=>{
e.preventDefault();

const item={
id:Date.now(),
name:$('pname').value.trim(),
price:Number($('pprice').value),
volume:$('pvolume').value.trim(),
category:$('pcategory').value.trim(),
image:$('pimage').value.trim(),
desc:$('pdesc').value.trim()
};

products.unshift(item);
save();
e.target.reset();
alert('Товар добавлен в каталог!');
});

$('search').addEventListener('input',render);
$('sort').addEventListener('change',render);

$('exportBtn').onclick=()=>{
const blob=new Blob(
[JSON.stringify(products,null,2)],
{type:'application/json'}
);
const a=document.createElement('a');
a.href=URL.createObjectURL(blob);
a.download='luxe-perfume-catalog.json';
a.click();
URL.revokeObjectURL(a.href);
};

$('importBtn').onclick=()=>{
$('importFile').click();
};

$('importFile').onchange=async e=>{
const f=e.target.files[0];
if(!f)return;

try{
const data=JSON.parse(await f.text());
if(!Array.isArray(data))throw Error();

products=data;
save();
alert('Каталог загружен!');
}catch{
alert('Не удалось прочитать файл.');
}

e.target.value='';
};

render();
renderCart();
</script>
</body>
</html>
